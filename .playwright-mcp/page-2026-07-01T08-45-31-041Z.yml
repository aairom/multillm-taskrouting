              - heading "Weighted FailoverDirect link to Weighted Failover" [level=3] [ref=e522]:
                - text: Weighted Failover
                - link "Direct link to Weighted Failover" [ref=e523] [cursor=pointer]:
                  - /url: "#weighted-failover"
                  - text: "#"
              - paragraph [ref=e524]:
                - text: By default, when a deployment in a model group fails, the router moves on to the next entry in
                - code [ref=e525]: fallbacks
                - text: (a different model group). With
                - code [ref=e526]: enable_weighted_failover
                - text: ", the router first retries"
                - strong [ref=e527]: inside the same model group
                - text: by re-picking a different deployment using the existing weights, and only escalates to cross-group fallbacks once every deployment in the group has been tried.
              - paragraph [ref=e528]:
                - text: This is useful when you have multiple regional copies of the same model (e.g. Azure
                - code [ref=e529]: eastus2
                - text: +
                - code [ref=e530]: swedencentral
                - text: ) and want a failed region to fail over to a healthy peer with the same
                - code [ref=e531]: model_name
                - text: ", instead of immediately switching to a different model."
              - paragraph [ref=e532]:
                - strong [ref=e533]: Behavior
              - list [ref=e534]:
                - listitem [ref=e535]:
                  - text: Only active when
                  - code [ref=e536]: routing_strategy="simple-shuffle"
                  - text: (the default).
                - listitem [ref=e537]:
                  - text: On a retryable failure, the failing deployment ID is excluded and a new deployment is picked from the remaining peers in the same model group, respecting
                  - code [ref=e538]: weight
                  - text: /
                  - code [ref=e539]: rpm
                  - text: /
                  - code [ref=e540]: tpm
                  - text: .
                - listitem [ref=e541]: "Exclusions accumulate across hops: each retry adds the previous failure to the exclusion set, so a deployment that just failed is never picked again in the same request chain."
                - listitem [ref=e542]:
                  - text: Capped by
                  - code [ref=e543]: max_fallbacks
                  - text: (default
                  - code [ref=e544]: "5"
                  - text: ).
                - listitem [ref=e545]:
                  - text: Not triggered for
                  - code [ref=e546]: ContextWindowExceededError
                  - text: or
                  - code [ref=e547]: ContentPolicyViolationError
                  - text: — those keep their dedicated fallback paths.
                - listitem [ref=e548]:
                  - text: "Async-only: honored by"
                  - code [ref=e549]: router.acompletion()
                  - text: and other async entrypoints. The sync
                  - code [ref=e550]: router.completion()
                  - text: path falls through to regular fallbacks.
                - listitem [ref=e551]:
                  - text: "Cooldowns still apply: a deployment that crosses"
                  - code [ref=e552]: allowed_fails
                  - text: is cooled down independently of weighted failover.
              - paragraph [ref=e553]:
                - strong [ref=e554]: Order vs. weight
              - paragraph [ref=e555]:
                - text: If the same group also uses
                - code [ref=e556]: order
                - text: ", the order filter runs"
                - strong [ref=e557]: before
                - text: the weighted pick. So weighted failover re-picks only among the deployments in the current minimum-order tier. Promotion to the next order tier happens through the existing order-based fallback path.
              - paragraph [ref=e558]:
                - strong [ref=e559]: Config
