                - text: ":"
              - list [ref=e604]:
                - listitem [ref=e605]:
                  - code [ref=e606]: simple-shuffle
                  - text: picks one of the two deployments using
                  - code [ref=e607]: weight
                  - text: .
                - listitem [ref=e608]:
                  - text: If the picked deployment raises a provider error (e.g.
                  - code [ref=e609]: RateLimitError
                  - text: ","
                  - code [ref=e610]: InternalServerError
                  - text: ), its deployment ID is added to
